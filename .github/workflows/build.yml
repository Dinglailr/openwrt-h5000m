name: Build H5000M Firmware

on:
  push:
    branches: [ h5000m-custom, h5000m-stable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
        fetch-depth: 1

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get autoremove -y >/dev/null
        df -h

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses-dev libssl-dev python3-distutils \
          rsync unzip zlib1g-dev file wget ccache

    - name: Cache staging dir
      uses: actions/cache@v4
      with:
        path: |
          staging_dir/host
          staging_dir/hostpkg
          build_dir/host
          build_dir/hostpkg
        key: staging-h5000m-${{ hashFiles('feeds.conf.default') }}
        restore-keys: staging-h5000m-

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-h5000m-${{ github.sha }}
        restore-keys: ccache-h5000m-

    - name: Update and install feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Expand .config
      run: make defconfig

    - name: Customize config
      run: |
        # ===== 应用过滤与文件管理 =====
        echo "CONFIG_PACKAGE_luci-app-oaf=y" >> .config
        echo "CONFIG_PACKAGE_open-app-filter=y" >> .config
        echo "CONFIG_PACKAGE_oaf=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-harbor-file=y" >> .config

        # ===== HomeProxy 及其核心 =====
        echo "CONFIG_PACKAGE_luci-app-homeproxy=y" >> .config
        echo "CONFIG_PACKAGE_sing-box=y" >> .config
        echo "CONFIG_PACKAGE_kmod-netlink-diag=y" >> .config
        echo "CONFIG_PACKAGE_kmod-nft-tproxy=y" >> .config
        echo "CONFIG_PACKAGE_firewall4=y" >> .config

        # ===== LocalClash 及其核心 =====
        echo "CONFIG_PACKAGE_luci-app-localclash=y" >> .config
        echo "CONFIG_PACKAGE_mihomo=y" >> .config
        echo "CONFIG_PACKAGE_ip-full=y" >> .config
        echo "CONFIG_PACKAGE_kmod-tun=y" >> .config

        # ===== Nikki 及其核心 =====
        echo "CONFIG_PACKAGE_luci-app-nikki=y" >> .config
        echo "CONFIG_PACKAGE_nikki=y" >> .config
        # Nikki 共用 mihomo 核心，已在上方勾选，无需重复

        # ===== QModem 通用界面 =====
        echo "CONFIG_PACKAGE_luci-app-qmodem-generic=y" >> .config

        # ===== AdGuardHome 优化版 =====
        echo "CONFIG_PACKAGE_luci-app-adguardhome-dashboard=y" >> .config

        # ===== Docker 相关 =====
        # Docker 核心组件
        echo "CONFIG_PACKAGE_dockerd=y" >> .config
        echo "CONFIG_PACKAGE_docker=y" >> .config
        # Docker 管理界面
        echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config
        echo "CONFIG_PACKAGE_luci-lib-docker=y" >> .config
        # Docker Compose（可选，但推荐加上）
        echo "CONFIG_PACKAGE_docker-compose=y" >> .config

        # ===== 处理依赖关系 =====
        make defconfig

    - name: Download sources
      run: make download -j$(nproc) V=s 2>&1 | grep -E "^(ERROR|WARNING)" || true

    - name: Build firmware
      run: make -j$(nproc) V=s 2>&1 | tee /tmp/build.log || make -j1 V=sc 2>&1 | tee /tmp/build.log

    - name: List artifacts
      if: always()
      run: find bin/targets/mediatek/filogic/ -type f 2>/dev/null | sort || echo "No output yet"

    - name: Upload firmware
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: h5000m-firmware-${{ github.run_number }}
        path: |
          bin/targets/mediatek/filogic/*hiveton*sysupgrade*
          bin/targets/mediatek/filogic/*hiveton*factory*
          bin/targets/mediatek/filogic/sha256sums
          bin/targets/mediatek/filogic/config.buildinfo
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_number }}
        path: /tmp/build.log
        retention-days: 7
